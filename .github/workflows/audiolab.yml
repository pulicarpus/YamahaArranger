name: Offline Audio Lab (real BASSMIDI)
# Renders the SF2 presets with the REAL BASS/BASSMIDI Linux SDK and the production BassMidiPlayer, then analyses the audio.
# No APK is built here. Results: job log (report) + artifact (WAV listening set, CSV, PNG, report.md).
on:
  push:
    branches: [lab/offline-audio]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: audiolab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SF2_ID: 17sScWkzOfGjV8wWxQFB0HtSn1AaQbp3b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python deps
        run: |
          set -euo pipefail
          pip install numpy matplotlib cffi
          pip install --no-deps tinysoundfont || echo "TinySoundFont reference unavailable (optional)"
      - name: Official BASS and BASSMIDI Linux SDKs
        run: |
          set -euo pipefail
          mkdir -p /tmp/bass-linux /tmp/bassmidi-linux
          curl -fL --retry 3 https://www.un4seen.com/files/bass24-linux.zip -o /tmp/bass-linux.zip
          curl -fL --retry 3 https://www.un4seen.com/files/bassmidi24-linux.zip -o /tmp/bassmidi-linux.zip
          sha256sum /tmp/bass-linux.zip /tmp/bassmidi-linux.zip
          unzip -q /tmp/bass-linux.zip -d /tmp/bass-linux
          unzip -q /tmp/bassmidi-linux.zip -d /tmp/bassmidi-linux
          echo "--- header versions"; grep -n "BASSVERSION\|BASSMIDIVERSION\|BASSVERSIONTEXT" /tmp/bass-linux/c/bass.h /tmp/bassmidi-linux/c/bassmidi.h | head
          echo "--- MIDI_EVENT_* defined by this SDK"; grep -o "define MIDI_EVENT_[A-Z_0-9]*" /tmp/bassmidi-linux/c/bassmidi.h | sort | tr '\n' ' '; echo
      - name: SF2 pack (user-supplied Colombo and Tyros)
        run: |
          set -euo pipefail
          mkdir -p /tmp/sf2
          curl -fL --retry 3 "https://drive.usercontent.google.com/download?id=${SF2_ID}&export=download&confirm=t" -o /tmp/SF2.zip
          ls -la /tmp/SF2.zip
          python3 - <<'PY'
          import zipfile
          z = zipfile.ZipFile('/tmp/SF2.zip')
          names = {n.rsplit('/', 1)[-1]: n for n in z.namelist()}
          print([n for n in names][:10])
          for want in ('ColomboGMGS2_BM.sf2', 'yamaha tyros 4_just_t4_fixed.sf2'):
              open('/tmp/sf2/' + want, 'wb').write(z.read(names[want]))
          PY
          rm -f /tmp/SF2.zip
          ls -la /tmp/sf2; sha256sum /tmp/sf2/*
      - name: Independent GM reference font (FluidR3, open licence)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq fluid-soundfont-gm
          ls -la /usr/share/sounds/sf2/ || true
      - name: Build the lab (real BASS + production BassMidiPlayer)
        run: |
          set -euo pipefail
          B=/tmp/bass-linux; M=/tmp/bassmidi-linux
          g++ -std=c++17 -O2 -pthread -I $B/c -I $M/c -I tests/mocks -I app/src/main/cpp \
            tools/audio_lab/audio_lab.cpp app/src/main/cpp/bassmidi_player.cpp \
            -L $B/libs/x86_64 -L $M/libs/x86_64 -Wl,-rpath,$B/libs/x86_64 -Wl,-rpath,$M/libs/x86_64 -lbassmidi -lbass -o /tmp/audio_lab
      - name: Render with raw BASSMIDI
        run: |
          set -euo pipefail
          mkdir -p /tmp/lab
          /tmp/audio_lab raw /tmp/lab /tmp/sf2/ColomboGMGS2_BM.sf2 "/tmp/sf2/yamaha tyros 4_just_t4_fixed.sf2" /usr/share/sounds/sf2/FluidR3_GM.sf2 2>&1 | tee /tmp/lab/raw.log
      - name: Render with the production BassMidiPlayer
        run: |
          set -euo pipefail
          /tmp/audio_lab player /tmp/lab /tmp/sf2/ColomboGMGS2_BM.sf2 "/tmp/sf2/yamaha tyros 4_just_t4_fixed.sf2" 2>&1 | grep -v "^\s*$" | tee /tmp/lab/player.log | grep "^LAB"
      - name: Normalisation proof (what the app changes in Colombo and Tyros)
        run: |
          python3 tools/audio_lab/sf2_compare.py /tmp/sf2/ColomboGMGS2_BM.sf2 "/tmp/sf2/yamaha tyros 4_just_t4_fixed.sf2" 2>&1 | tee /tmp/lab/sf2_compare.log
      - name: Analyse
        run: |
          set -euo pipefail
          python3 tools/audio_lab/analyze.py --in /tmp/lab --out /tmp/lab_report --tsf-dir /tmp/sf2 2>&1 | tee /tmp/lab_report_stdout.txt
      - name: Summary (last lines of the log = the evidence)
        run: |
          python3 - <<'PY'
          import re
          t = open('/tmp/lab_report/report.md').read()
          parts = re.split(r'\n(?=## )', t)
          want = ('## T8', '## T7', '## Automatic findings')
          print('=====SUMMARY-BEGIN=====')
          print(open('/tmp/lab/sf2_compare.log').read())
          for p in parts:
              if p.startswith(want): print(p)
          print('=====SUMMARY-END=====')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audio-lab-${{ github.sha }}
          path: |
            /tmp/lab_report/**
            /tmp/lab/raw.log
            /tmp/lab/player.log
            /tmp/lab/sf2_compare.log
            /tmp/lab/manifest_*.csv
          if-no-files-found: warn
