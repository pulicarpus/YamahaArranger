name: Android compile (quick)
on:
  push:
    branches: [experiment/midi-out-octave, experiment/style-editor-back]
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: nttld/setup-ndk@v1
        with: { ndk-version: r26d, link-to-sdk: true }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Install byte-pinned official SDK inputs
        run: |
          set -euo pipefail
          mkdir evidence
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'cmake;3.22.1' 'build-tools;34.0.0' 'platforms;android-34'
          python3 tools/install_u01_android_sdk.py > evidence/sdk-identities.json
      - name: compileDebugKotlin (Kotlin + Compose only, no APK)
        run: |
          set -euo pipefail
          gradle --no-daemon --max-workers=2 compileDebugKotlin --stacktrace 2>&1 | tee evidence/android-compile.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-compile-log-${{ github.run_id }}
          path: evidence/
