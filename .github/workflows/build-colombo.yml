name: Build Colombo Fallback APK
on:
  push:
    branches:
      - feat/colombo-primary-fallback
    paths-ignore:
      - "docs/**"
      - "PROJECT_NOTES.md"
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      BASS_ANDROID_URL: https://www.un4seen.com/files/bass24-android.zip
      BASSMIDI_URL: https://www.un4seen.com/files/bassmidi24-android.zip
    steps:
      - uses: actions/checkout@v4
      - name: Test family-preserving resolver
        run: python3 tools/test_voice_resolver.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept SDK licenses
        run: yes $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          link-to-sdk: true
      - name: Install CMake
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "cmake;3.22.1" > /dev/null
      - name: Install BASS and BASSMIDI
        run: |
          set -euo pipefail
          rm -rf /tmp/bass /tmp/bassmidi
          mkdir -p /tmp/bass /tmp/bassmidi
          curl -fL "$BASS_ANDROID_URL" -o /tmp/bass.zip
          curl -fL "$BASSMIDI_URL" -o /tmp/bassmidi.zip
          unzip -q /tmp/bass.zip -d /tmp/bass
          unzip -q /tmp/bassmidi.zip -d /tmp/bassmidi
          mkdir -p app/src/main/cpp/basssdk
          BASS_H="$(find /tmp/bass -type f -iname 'bass.h' -print -quit)"
          BASSMIDI_H="$(find /tmp/bassmidi -type f -iname 'bassmidi.h' -print -quit)"
          test -n "$BASS_H" && test -n "$BASSMIDI_H"
          cp "$BASS_H" app/src/main/cpp/basssdk/bass.h
          cp "$BASSMIDI_H" app/src/main/cpp/basssdk/bassmidi.h
          for abi in arm64-v8a armeabi-v7a; do
            mkdir -p "app/src/main/jniLibs/$abi"
            cp "$(find /tmp/bass -type f -path "*/$abi/libbass.so" -print -quit)" "app/src/main/jniLibs/$abi/libbass.so"
            cp "$(find /tmp/bassmidi -type f -path "*/$abi/libbassmidi.so" -print -quit)" "app/src/main/jniLibs/$abi/libbassmidi.so"
          done
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: YamahaArranger-Colombo-Fallback
          path: app/build/outputs/apk/debug/app-debug.apk

