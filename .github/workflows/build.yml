name: Build APK
on:
  push:
    branches:
      - main
      - feat/bassmidi-engine-build448
      - fix/audio-transition-preset-cache
      - integration/bassmidi-casm-sx720
      - feat/sf2-style-inspector
      - fix/yamaha-panel-sustain-clean
      - feat/voice-resolver-v2-multisf2
      - feat/family-preserving-multisf2
      - diag/audio-path-presence
      - diag/drum-compatibility-compact
      - diag/sf2-semantic-inventory
      - fix/accompaniment-presence-781
    paths-ignore:
      - "docs/**"
      - "PROJECT_NOTES.md"
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      BASS_ANDROID_URL: https://www.un4seen.com/files/bass24-android.zip
      BASSMIDI_URL: https://www.un4seen.com/files/bassmidi24-android.zip
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: "Check out #770 performance baseline (read only)"
        uses: actions/checkout@v4
        with:
          ref: 376ebe2884e743f1f32ae0c56201ed5a342805bb
          path: .shadow-baseline
          persist-credentials: false
      - name: "Check out #772 production baseline (read only)"
        uses: actions/checkout@v4
        with:
          ref: c2bd51c7896d8418e53d681e30bff0a649fb4874
          path: .shadow-baseline772
          persist-credentials: false
      - name: Test family-preserving resolver
        run: |
          python3 tools/test_voice_resolver.py
          python3 tools/compare_drum_shadow_baseline.py .shadow-baseline
          python3 tools/compare_drum_shadow_baseline.py .shadow-baseline772 --label baseline772
      - name: "Check out #773 engineering baseline (read only)"
        uses: actions/checkout@v4
        with:
          ref: a66beeb3365e29b8454df154251ad88242dd6961
          path: .shadow-baseline773
          persist-credentials: false
      - name: Verify #773 production trace unchanged
        run: python3 tools/compare_drum_shadow_baseline.py .shadow-baseline773 --label baseline773
      - name: "Check out #776 regression baseline (read only)"
        uses: actions/checkout@v4
        with:
          ref: 2f71950f6343bbfb723994ae6a2373130606a857
          path: .regression-baseline776
          persist-credentials: false
      - name: Verify Stage 3 bypass and reviewed accompaniment patch against build 776
        run: |
          python3 tools/test_production_regression_bypass.py .regression-baseline776
          python3 tools/compare_drum_shadow_baseline.py .regression-baseline776 --label baseline776
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: "Check out #774 end-to-end baseline (read only)"
        uses: actions/checkout@v4
        with:
          ref: 4b1ca4701d9e955f9feddc2cde1161c537d41260
          path: .shadow-baseline774
          persist-credentials: false
      - name: Verify #774 production trace unchanged
        run: python3 tools/compare_drum_shadow_baseline.py .shadow-baseline774 --label baseline774
      - name: Accept Android SDK licenses
        run: yes $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
      - name: Set up Android NDK r26d
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          link-to-sdk: true
      - name: Install CMake
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "cmake;3.22.1" > /dev/null
      - name: Download BASS/BASSMIDI Android SDKs
        run: |
          set -euo pipefail
          rm -rf /tmp/bass /tmp/bassmidi
          mkdir -p /tmp/bass /tmp/bassmidi
          curl -fL "$BASS_ANDROID_URL" -o /tmp/bass-android.zip
          curl -fL "$BASSMIDI_URL" -o /tmp/bassmidi.zip
          unzip -q /tmp/bass-android.zip -d /tmp/bass
          unzip -q /tmp/bassmidi.zip -d /tmp/bassmidi
          mkdir -p app/src/main/cpp/basssdk
          BASS_H="$(find /tmp/bass -type f -iname 'bass.h' -print -quit)"
          BASSMIDI_H="$(find /tmp/bassmidi -type f -iname 'bassmidi.h' -print -quit)"
          if [ -z "$BASSMIDI_H" ] && [ -f /tmp/bassmidi/c/bassmidi.h ]; then BASSMIDI_H="/tmp/bassmidi/c/bassmidi.h"; fi
          if [ -z "$BASSMIDI_H" ] && [ -f /tmp/bassmidi/C/BASSMIDI.H ]; then BASSMIDI_H="/tmp/bassmidi/C/BASSMIDI.H"; fi
          test -n "$BASS_H"
          test -n "$BASSMIDI_H"
          cp "$BASS_H" app/src/main/cpp/basssdk/bass.h
          cp "$BASSMIDI_H" app/src/main/cpp/basssdk/bassmidi.h
          for abi in arm64-v8a armeabi-v7a; do
            mkdir -p "app/src/main/jniLibs/$abi"
            BASS_SO="$(find /tmp/bass -type f -path "*/$abi/libbass.so" -print -quit)"
            BASSMIDI_SO="$(find /tmp/bassmidi -type f -path "*/$abi/libbassmidi.so" -print -quit)"
            test -n "$BASS_SO"
            test -n "$BASSMIDI_SO"
            cp "$BASS_SO" "app/src/main/jniLibs/$abi/libbass.so"
            cp "$BASSMIDI_SO" "app/src/main/jniLibs/$abi/libbassmidi.so"
          done
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        run: |
          gradle testDebugUnitTest --stacktrace
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          suites=[ET.parse(p).getroot() for p in Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml')]
          counts={k:sum(int(s.get(k,0)) for s in suites) for k in ['tests','failures','errors','skipped']}
          print('JVM_RESULTS',counts)
          assert counts['failures']==counts['errors']==counts['skipped']==0
          replay=[s for s in suites if 'GenericDrumGlobalReplayTest' in s.get('name','') or 'ProductionDrum' in s.get('name','') or 'StylePartPresenceRegressionTest' in s.get('name','')]
          for s in replay:
              print(s.findtext('system-out',''))
          PY
          gradle assembleDebug --stacktrace
          python3 -c "import zipfile; z=zipfile.ZipFile('app/build/outputs/apk/debug/app-debug.apk'); assert 'drum_shadow_audit770_v1.tsv' in z.namelist(); print('APK bundled semantic registry PRESENT')"
      - name: Verify Stage 3 excluded from both APK native ABIs
        run: |
          python3 - <<'PY'
          import zipfile
          z=zipfile.ZipFile('app/build/outputs/apk/debug/app-debug.apk')
          for abi in ['arm64-v8a','armeabi-v7a']:
              data=z.read('lib/'+abi+'/libyamaha_arranger_native.so')
              for symbol in [b'nativePrepareExperimentalDrum',b'nativeExperimentalDrumOn',b'nativeExperimentalDrumOff',b'nativeEnableExperimentalDrum',b'nativeClearExperimentalDrum']:
                  assert symbol not in data,(abi,symbol)
              print('APK_STAGE3_BYPASSED',abi)
          PY
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Upload full global shadow comparison
        uses: actions/upload-artifact@v4
        with:
          name: generic-drum-shadow-proof
          path: |
            app/build/generic-drum-global-replay.txt
            app/build/test-results/testDebugUnitTest/TEST-*GenericDrum*.xml
            app/build/test-results/testDebugUnitTest/TEST-*ShadowDrumRuntime*.xml
            tests/fixtures/production_baseline776_sha256.json
            docs/REGRESSION_780_RECOVERY.md
      - name: Upload accompaniment presence proof
        uses: actions/upload-artifact@v4
        with:
          name: accompaniment-presence-proof
          path: |
            app/build/accompaniment-presence-replay.txt
            app/build/test-results/testDebugUnitTest/TEST-*StylePartPresence*.xml
            tests/fixtures/accompaniment_presence781_patch.json
            docs/ACCOMPANIMENT_PRESENCE_781.md
      - name: Send APK to Telegram
        if: github.ref != 'refs/heads/diag/sf2-semantic-inventory' && github.ref != 'refs/heads/fix/accompaniment-presence-781'
        continue-on-error: true
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          document: app/build/outputs/apk/debug/app-debug.apk
          message: |
            🎹 *YamahaArranger BASSMIDI Build!*
            🔊 BASSMIDI native engine
            🧪 Build #${{ github.run_number }}
