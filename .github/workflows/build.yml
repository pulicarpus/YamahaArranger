name: Build APK

on:
  # ⛔ Auto-build saat push DINONAKTIFKAN (uncomment kalau mau aktif)
  # push:
  #   branches: [ main, "feature-**" ]

  # ✅ Build manual dari tab Actions
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK + CMake
        run: |
          sdkmanager --install "ndk;26.3.11579264" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      # ✅ Upload APK sebagai artifact GitHub (backup)
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Send APK to Telegram
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          document: app/build/outputs/apk/debug/app-debug.apk
          message: |
            🎹 *YamahaArranger APK Built!*
            
            ✅ Build sukses, Bos!
            
            📦 Build No: #${{ github.run_number }}
            🌿 Branch: `${{ github.ref_name }}`
            👤 Author: ${{ github.actor }}
            
            📲 APK siap di-install di atas! 👆