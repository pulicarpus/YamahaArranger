name: Build APK
on:
  push:
    branches:
      - feat/bassmidi-engine-build448
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      BASS_ANDROID_URL: https://www.un4seen.com/stuff/bass-android.zip
      BASS_HEADER_URL: https://www.un4seen.com/stuff/bass.zip
      BASSMIDI_URL: https://www.un4seen.com/files/bassmidi24-android.zip
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
      - name: Set up Android NDK r26d
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          link-to-sdk: true
      - name: Install CMake
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "cmake;3.22.1" > /dev/null
      - name: Download BASS/BASSMIDI Android SDKs
        run: |
          set -euo pipefail
          rm -rf /tmp/bass /tmp/bassheader /tmp/bassmidi
          mkdir -p /tmp/bass /tmp/bassheader /tmp/bassmidi
          curl -fL "$BASS_ANDROID_URL" -o /tmp/bass-android.zip
          curl -fL "$BASS_HEADER_URL" -o /tmp/bass-header.zip
          curl -fL "$BASSMIDI_URL" -o /tmp/bassmidi.zip
          unzip -q /tmp/bass-android.zip -d /tmp/bass
          unzip -q /tmp/bass-header.zip -d /tmp/bassheader
          unzip -q /tmp/bassmidi.zip -d /tmp/bassmidi

          echo "=== BASS header candidates ==="
          find /tmp/bassheader -type f -iname 'bass.h' -print
          echo "=== BASSMIDI header candidates ==="
          find /tmp/bassmidi -type f \( -iname 'bassmidi.h' -o -iname 'BASSMIDI.H' \) -print
          echo "=== BASSMIDI native libraries ==="
          find /tmp/bassmidi -type f -name 'libbassmidi.so' -print

          mkdir -p app/src/main/cpp/basssdk
          BASS_H="$(find /tmp/bassheader -type f -iname 'bass.h' -print -quit)"
          BASSMIDI_H="$(find /tmp/bassmidi -type f -iname 'bassmidi.h' -print -quit)"

          # The official archive is known to contain c/bassmidi.h; keep an
          # explicit fallback in case find/path handling differs on the runner.
          if [ -z "$BASSMIDI_H" ] && [ -f /tmp/bassmidi/c/bassmidi.h ]; then
            BASSMIDI_H="/tmp/bassmidi/c/bassmidi.h"
          fi
          if [ -z "$BASSMIDI_H" ] && [ -f /tmp/bassmidi/C/BASSMIDI.H ]; then
            BASSMIDI_H="/tmp/bassmidi/C/BASSMIDI.H"
          fi

          if [ -z "$BASS_H" ]; then
            echo "::error::BASS header not found"
            exit 1
          fi
          if [ -z "$BASSMIDI_H" ]; then
            echo "::error::BASSMIDI header not found in official SDK archive"
            unzip -l /tmp/bassmidi.zip | sed -n '1,160p'
            exit 1
          fi

          cp "$BASS_H" app/src/main/cpp/basssdk/bass.h
          cp "$BASSMIDI_H" app/src/main/cpp/basssdk/bassmidi.h

          for abi in arm64-v8a armeabi-v7a; do
            mkdir -p "app/src/main/jniLibs/$abi"
            BASS_SO="$(find "/tmp/bass/$abi" -type f -name 'libbass.so' -print -quit)"
            BASSMIDI_SO="$(find "/tmp/bassmidi" -type f -path "*/$abi/libbassmidi.so" -print -quit)"
            if [ -z "$BASS_SO" ]; then
              echo "::error::libbass.so not found for $abi"
              exit 1
            fi
            if [ -z "$BASSMIDI_SO" ]; then
              echo "::error::libbassmidi.so not found for $abi"
              exit 1
            fi
            cp "$BASS_SO" "app/src/main/jniLibs/$abi/libbass.so"
            cp "$BASSMIDI_SO" "app/src/main/jniLibs/$abi/libbassmidi.so"
          done

          test -s app/src/main/cpp/basssdk/bass.h
          test -s app/src/main/cpp/basssdk/bassmidi.h
          test -s app/src/main/jniLibs/arm64-v8a/libbass.so
          test -s app/src/main/jniLibs/arm64-v8a/libbassmidi.so
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Send APK to Telegram
        continue-on-error: true
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          document: app/build/outputs/apk/debug/app-debug.apk
          message: |
            🎹 *YamahaArranger BASSMIDI Build!*
            🔊 BASSMIDI native engine
            🧪 Build #${{ github.run_number }}
