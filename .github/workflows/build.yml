name: Build APK
on:
  push:
    branches:
      - feat/bassmidi-engine-build448
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      BASS_ANDROID_URL: https://www.un4seen.com/stuff/bass-android.zip
      BASS_HEADER_URL: https://www.un4seen.com/stuff/bass.zip
      BASSMIDI_URL: https://www.un4seen.com/stuff/bassmidi-android.zip
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
      - name: Set up Android NDK r26d
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          link-to-sdk: true
      - name: Install CMake
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "cmake;3.22.1" > /dev/null
      - name: Download BASS/BASSMIDI Android SDKs
        run: |
          set -e
          mkdir -p /tmp/bass /tmp/bassheader /tmp/bassmidi
          curl -fL "$BASS_ANDROID_URL" -o /tmp/bass-android.zip
          curl -fL "$BASS_HEADER_URL" -o /tmp/bass-header.zip
          curl -fL "$BASSMIDI_URL" -o /tmp/bassmidi.zip
          unzip -q /tmp/bass-android.zip -d /tmp/bass
          unzip -q /tmp/bass-header.zip -d /tmp/bassheader
          unzip -q /tmp/bassmidi.zip -d /tmp/bassmidi
          mkdir -p app/src/main/cpp/basssdk
          BASS_H="$(find /tmp/bassheader -type f -iname 'bass.h' | head -1)"
          BASSMIDI_H="$(find /tmp/bassmidi -type f -iname 'bassmidi.h' | head -1)"
          test -n "$BASS_H" && test -n "$BASSMIDI_H"
          cp "$BASS_H" app/src/main/cpp/basssdk/bass.h
          cp "$BASSMIDI_H" app/src/main/cpp/basssdk/bassmidi.h
          for abi in arm64-v8a armeabi-v7a; do
            mkdir -p "app/src/main/jniLibs/$abi"
            cp "/tmp/bass/$abi/libbass.so" "app/src/main/jniLibs/$abi/libbass.so"
            cp "/tmp/bassmidi/libs/$abi/libbassmidi.so" "app/src/main/jniLibs/$abi/libbassmidi.so"
          done
          test -s app/src/main/cpp/basssdk/bass.h
          test -s app/src/main/cpp/basssdk/bassmidi.h
          test -s app/src/main/jniLibs/arm64-v8a/libbass.so
          test -s app/src/main/jniLibs/arm64-v8a/libbassmidi.so
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Send APK to Telegram
        continue-on-error: true
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          document: app/build/outputs/apk/debug/app-debug.apk
          message: |
            🎹 *YamahaArranger BASSMIDI Build!*
            🔊 BASSMIDI native engine
            🧪 Build #${{ github.run_number }}
