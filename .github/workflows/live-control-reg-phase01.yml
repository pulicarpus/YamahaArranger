name: LIVE REG Phase 0-1 contracts (no APK)
on:
  push:
    branches: [experiment/live-control-reg]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  contracts:
    if: github.ref == 'refs/heads/experiment/live-control-reg'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install real Linux BASSMIDI (PCM regression)
        run: |
          set -euo pipefail
          mkdir -p /tmp/bass-linux /tmp/bassmidi-linux evidence
          curl -fL --retry 3 https://www.un4seen.com/files/bass24-linux.zip -o /tmp/bass-linux.zip
          curl -fL --retry 3 https://www.un4seen.com/files/bassmidi24-linux.zip -o /tmp/bassmidi-linux.zip
          unzip -q /tmp/bass-linux.zip -d /tmp/bass-linux
          unzip -q /tmp/bassmidi-linux.zip -d /tmp/bassmidi-linux
          sha256sum /tmp/bass-linux/libs/x86_64/libbass.so /tmp/bassmidi-linux/libs/x86_64/libbassmidi.so > evidence/linux-sdk.sha256
      - name: Phase 0-1 isolation, persistence P1-P12, unchanged baseline and PCM gates
        run: |
          set -euo pipefail
          python3 tools/test_live_reg.py --baseline --real --fetch-dependencies 2>&1 | tee evidence/phase01.log
          git diff --exit-code HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LiveReg-phase01-evidence-${{ github.sha }}
          path: evidence/
