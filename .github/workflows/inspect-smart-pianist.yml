name: Inspect Smart Pianist

on:
  push:
    paths:
      - '.github/workflows/inspect-smart-pianist.yml'
  workflow_dispatch:
    inputs:
      version:
        description: "Smart Pianist version on APKPure (for example 3.10.0 or latest)"
        required: true
        default: "latest"
        type: string
      apk_url:
        description: "Optional direct XAPK URL; leave empty to use APKPure"
        required: false
        default: ""
        type: string

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Smart Pianist XAPK
        env:
          VERSION: ${{ inputs.version || 'latest' }}
          APK_URL: ${{ inputs.apk_url }}
        run: |
          set -euo pipefail
          if [ -n "$APK_URL" ]; then URL="$APK_URL"; else URL="https://d.apkpure.net/b/XAPK/jp.co.yamaha.smartpianist?version=${VERSION}"; fi
          echo "Source URL: $URL" | tee download-source.txt
          curl -L --fail --retry 3 --retry-delay 2 --retry-all-errors --output smart-pianist.xapk "$URL"
          ls -lh smart-pianist.xapk
          sha256sum smart-pianist.xapk | tee smart-pianist-xapk.sha256

      - name: Extract XAPK
        run: |
          set -euo pipefail
          mkdir -p xapk
          unzip -q smart-pianist.xapk -d xapk
          echo "=== XAPK contents ===" | tee xapk-contents.txt
          find xapk -maxdepth 3 -type f -printf '%p\t%s bytes\n' | sort | tee -a xapk-contents.txt
          test -f xapk/jp.co.yamaha.smartpianist.apk

      - name: Static package inventory
        run: |
          set -euo pipefail
          python3 tools/smart_pianist_inspector.py xapk | tee smart-pianist-static-report.txt

      - name: Install JADX 1.5.6
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-all-errors -o jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip
          mkdir -p jadx
          unzip -q jadx.zip -d jadx
          chmod +x jadx/bin/jadx
          jadx/bin/jadx --version

      - name: Decompile actual Smart Pianist APK
        run: |
          set -euo pipefail
          BASE="xapk/jp.co.yamaha.smartpianist.apk"
          test -f "$BASE"
          echo "Base APK: $BASE" | tee jadx-source.txt
          mkdir -p jadx-out
          ./jadx/bin/jadx --threads-count 2 --show-bad-code --no-res -d jadx-out "$BASE" > jadx.log 2>&1 || true
          echo "JADX log:" > smart-pianist-jadx-report.txt
          tail -n 160 jadx.log >> smart-pianist-jadx-report.txt || true
          echo >> smart-pianist-jadx-report.txt
          echo "=== Targeted source matches ===" >> smart-pianist-jadx-report.txt
          grep -RniE --include='*.java' 'MIDI|SysEx|sysex|System.?Exclusive|jp\.co\.yamaha|yamaha|Smart.?Pianist|Chord|Style|Accompaniment|Backing|CASM|SFF|NTR|NTT|RTR|High.?Key|Note.?Limit|Program.?Change|Bank.?Select|USB|Bluetooth|BLE|MidiManager|MidiDevice|MidiPort' jadx-out 2>/dev/null | head -n 2500 >> smart-pianist-jadx-report.txt || true

      - name: Deep-target MIDI and style code
        run: |
          set -euo pipefail
          {
            echo "=== SMART PIANIST DEEP TARGET REPORT ==="
            echo "Generated from decompiled main APK."
            echo
            for term in 'StylePlayback' 'ChangeStyleStartStopUC' 'SharedMIDIOut' 'MIDIChannel' 'MIDI7bitEncoder' 'MusicStructure' 'MusicalPosition' 'Tatum' 'TatumRelatedInfo' 'SMFAnalysisResult' 'StyleSelect' 'ChordEditChord' 'splitPointStyle'; do
              echo "===== TERM: $term ====="
              grep -RniE --include='*.java' "$term" jadx-out 2>/dev/null | head -n 80 || true
              echo
            done
            echo "===== FILES WITH STYLE PLAYBACK / STYLE CHANGE ====="
            grep -RliE --include='*.java' 'StylePlayback|ChangeStyleStartStopUC|StyleSelect' jadx-out 2>/dev/null | sort | head -n 80 | while read -r f; do
              echo "--- $f ---"
              grep -nE -B12 -A35 'StylePlayback|ChangeStyleStartStopUC|StyleSelect' "$f" | head -n 220 || true
            done
            echo
            echo "===== MIDI OUTPUT / CHANNEL CODE ====="
            grep -RliE --include='*.java' 'SharedMIDIOut|MIDIChannel|MIDI7bitEncoder' jadx-out 2>/dev/null | sort | head -n 80 | while read -r f; do
              echo "--- $f ---"
              grep -nE -B10 -A30 'SharedMIDIOut|MIDIChannel|MIDI7bitEncoder' "$f" | head -n 240 || true
            done
            echo
            echo "===== CHORD / MUSIC STRUCTURE CODE ====="
            grep -RliE --include='*.java' 'MusicStructure|MusicalPosition|TatumRelatedInfo|Chord' jadx-out 2>/dev/null | sort | head -n 60 | while read -r f; do
              echo "--- $f ---"
              grep -nE -B8 -A25 'MusicStructure|MusicalPosition|TatumRelatedInfo|Chord' "$f" | head -n 180 || true
            done
            echo
            echo "===== MANIFEST / MIDI CAPABILITIES ====="
            if [ -f jadx-out/resources/AndroidManifest.xml ]; then
              grep -niE 'MIDI|USB|BLUETOOTH|BLUETOOTH_CONNECT|BLUETOOTH_SCAN|INTERNET|WIFI' jadx-out/resources/AndroidManifest.xml || true
            fi
          } | tee smart-pianist-deep-report.txt

      - name: Inspect native libraries from ARM64 config APK
        run: |
          set -euo pipefail
          rm -rf native-arm64
          mkdir -p native-arm64
          unzip -q xapk/config.arm64_v8a.apk -d native-arm64
          {
            echo "=== Native libraries ==="
            find native-arm64 -type f -name '*.so' -printf '%p\t%s bytes\n' | sort
            echo
            echo "=== Focused C++ symbols ==="
            for f in native-arm64/lib/arm64-v8a/libKotlinAccompPatternEstimator.so native-arm64/lib/arm64-v8a/libKotlinChordSimplifier.so native-arm64/lib/arm64-v8a/libKotlinSMFUtility.so native-arm64/lib/arm64-v8a/libSmartPianist.so native-arm64/lib/arm64-v8a/libusbaudiomidilib.so native-arm64/lib/arm64-v8a/libYamahaWiFiAudio.so; do
              if [ -f "$f" ]; then
                echo "--- $f ---"
                nm -D --defined-only "$f" 2>/dev/null | c++filt | grep -Ei 'MIDI|SysEx|Yamaha|Style|Acmp|Accomp|Chord|Pattern|Section|SMF|MidiEvent|Timestamped|Audio.*MIDI|USB|Bluetooth|ProgramChange|BankSelect|NoteOn|NoteOff' | head -n 500 || true
              fi
            done
            echo
            echo "=== Interesting native strings ==="
            find native-arm64 -type f -name '*.so' -print0 | while IFS= read -r -d '' f; do
              echo "--- $f ---"
              strings -a "$f" | grep -Ei 'midi|sysex|yamaha|pianist|chord|style|accompan|backing|casm|sff|ntr|ntt|rtr|usb|bluetooth|ble|audio|soundfont|smf|score' | head -n 500 || true
            done
          } | tee smart-pianist-native-report.txt

      - name: Inspect Yamaha StyleDB SQLite database
        run: |
          set -euo pipefail
          rm -rf analysis-resource
          mkdir -p analysis-resource
          unzip -q xapk/AssetPack_AnalysisEngineResource.apk -d analysis-resource
          DB="$(find analysis-resource -type f -name 'StyleDB_MainAll_60.sqlite3' | head -n 1)"
          test -n "$DB"
          echo "StyleDB: $DB" | tee smart-pianist-style-db-report.txt
          python3 - "$DB" <<'PY' | tee -a smart-pianist-style-db-report.txt
          import sqlite3, sys
          db = sys.argv[1]
          con = sqlite3.connect(db)
          con.row_factory = sqlite3.Row
          print("=== TABLES ===")
          tables = [r[0] for r in con.execute("select name from sqlite_master where type='table' order by name")]
          for t in tables: print(t)
          print("\n=== TABLE SCHEMA / COUNTS ===")
          for t in tables:
              print(f"\n--- {t} ---")
              cols = con.execute(f'pragma table_info("{t}")').fetchall()
              print("columns:", ", ".join(f"{c['name']}:{c['type']}" for c in cols))
              print("count:", con.execute(f'select count(*) from "{t}"').fetchone()[0])
          print("\n=== FIRST 25 STYLE ROWS ===")
          for r in con.execute('select * from mtable order by id limit 25'): print(dict(r))
          print("\n=== DISTINCT SECTION / CATEGORY / GENRE ===")
          for col in ('section','category','genre','meter'):
              print(col, [r[0] for r in con.execute(f'select distinct "{col}" from mtable order by 1 limit 100')])
          con.close()
          PY

      - name: Upload inspection report
        uses: actions/upload-artifact@v4
        with:
          name: smart-pianist-inspection
          path: |
            download-source.txt
            smart-pianist-xapk.sha256
            xapk-contents.txt
            smart-pianist-static-report.txt
            smart-pianist-jadx-report.txt
            smart-pianist-deep-report.txt
            smart-pianist-native-report.txt
            smart-pianist-style-db-report.txt
            jadx-source.txt
          if-no-files-found: error
          retention-days: 14
