name: Realtime MIDI & audio stress diagnostic
# DIAGNOSTIC ONLY: host/mock measurements and real-BASSMIDI (Linux x86) cost curves. Builds no APK and changes no production file.
on:
  push:
    branches: [diag/realtime-midi-stress, diag/chord-change-stutter, diag/main-fill-transition-gap, diag/hardrock2-transition-gap]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  rtdiag:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Fetch and verify pinned JVM test inputs
        run: |
          set -euo pipefail
          mkdir -p evidence build/sff1-jvm/dependencies
          python3 - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          for entry in json.loads(Path('tests/fixtures/sff1_jvm_dependencies.json').read_text())['dependencies']:
              path=Path('build/sff1-jvm/dependencies')/entry['filename']
              subprocess.run(['curl','-fsSL','--retry','3',entry['url'],'-o',str(path)],check=True)
              assert hashlib.sha256(path.read_bytes()).hexdigest()==entry['sha256'],entry['filename']
          PY
      - name: Chord-change stutter guard (audit only, no production change)
        if: github.ref == 'refs/heads/diag/chord-change-stutter'
        run: python3 tools/test_chord_stutter_guard.py 2>&1 | tee evidence/chord-stutter-guard.log
      - name: Chord-change stutter harness (production chain, ROSITA, model costs; HOST evidence only)
        if: github.ref == 'refs/heads/diag/chord-change-stutter'
        run: python3 tools/test_rtdiag.py --out evidence/chord-stutter --rosita --only com.yourapp.rtdiag.ChordChangeStutterTest 2>&1 | tee evidence/chord-stutter.log
      - name: Main/Fill transition gap audit guard (no production change)
        if: github.ref == 'refs/heads/diag/main-fill-transition-gap'
        run: python3 tools/test_transition_gap_guard.py 2>&1 | tee evidence/transition-gap-guard.log
      - name: Main/Fill transition gap harness (production chain, real ROSITA.STY, HOST evidence only)
        if: github.ref == 'refs/heads/diag/main-fill-transition-gap'
        env:
          SGAP_EXPECT: current
        run: python3 tools/test_rtdiag.py --out evidence/transition-gap --rosita --only com.yourapp.rtdiag.SectionTransitionGapTest,com.yourapp.rtdiag.P1ChainTest,com.yourapp.rtdiag.OrderedNoteIoUnitTest 2>&1 | tee evidence/transition-gap.log
      - name: HardRock2 transition audit guard (no production change)
        if: github.ref == 'refs/heads/diag/hardrock2-transition-gap'
        run: python3 tools/test_hardrock2_audit_guard.py 2>&1 | tee evidence/hardrock2-guard.log
      - name: HardRock2.S578.prs through the production parser, Main/Fill/Main harness (HOST evidence only)
        if: github.ref == 'refs/heads/diag/hardrock2-transition-gap'
        env:
          SGAP_EXPECT: current
        run: python3 tools/test_rtdiag.py --out evidence/hardrock2 --rosita --style tests/fixtures/hardrock2/HardRock2.S578.prs --style-name HardRock2.S578.prs --only com.yourapp.rtdiag.SectionTransitionGapTest,com.yourapp.rtdiag.P1ChainTest,com.yourapp.rtdiag.OrderedNoteIoUnitTest 2>&1 | tee evidence/hardrock2.log
      - name: ROSITA control with the same harness
        if: github.ref == 'refs/heads/diag/hardrock2-transition-gap'
        env:
          SGAP_EXPECT: current
        run: python3 tools/test_rtdiag.py --out evidence/rosita-control --rosita --only com.yourapp.rtdiag.SectionTransitionGapTest 2>&1 | tee evidence/rosita-control.log
      - name: Host JVM stress (production MIDI parser -> Brain -> Sequencer -> Engine, fake ports/JNI)
        run: python3 tools/test_rtdiag.py --out evidence/rtdiag-jvm 2>&1 | tee evidence/rtdiag-jvm.log
      - name: Native production note/render code with MOCK BASS (overhead + mutex contention model)
        run: python3 tools/test_rtdiag_native.py --out evidence/rtdiag-native 2>&1 | tee evidence/rtdiag-native.log
      - name: Real Linux BASSMIDI decode-cost curve (synthetic SF2, x86)
        run: |
          set -euo pipefail
          mkdir -p /tmp/bass-linux /tmp/bassmidi-linux
          curl -fL --retry 3 https://www.un4seen.com/files/bass24-linux.zip -o /tmp/bass-linux.zip
          curl -fL --retry 3 https://www.un4seen.com/files/bassmidi24-linux.zip -o /tmp/bassmidi-linux.zip
          unzip -q /tmp/bass-linux.zip -d /tmp/bass-linux
          unzip -q /tmp/bassmidi-linux.zip -d /tmp/bassmidi-linux
          python3 tools/test_rtdiag_real_bass.py /tmp/bass-linux /tmp/bassmidi-linux --out evidence/rtdiag-real 2>&1 | tee evidence/rtdiag-real.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RTDIAG-evidence-${{ github.run_id }}
          path: |
            evidence/**/*.log
            evidence/**/*.txt
          if-no-files-found: error
