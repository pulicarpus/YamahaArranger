name: Realtime MIDI & audio stress diagnostic
# DIAGNOSTIC ONLY: host/mock measurements and real-BASSMIDI (Linux x86) cost curves. Builds no APK and changes no production file.
on:
  push:
    branches: [diag/realtime-midi-stress]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  rtdiag:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Fetch and verify pinned JVM test inputs
        run: |
          set -euo pipefail
          mkdir -p evidence build/sff1-jvm/dependencies
          python3 - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          for entry in json.loads(Path('tests/fixtures/sff1_jvm_dependencies.json').read_text())['dependencies']:
              path=Path('build/sff1-jvm/dependencies')/entry['filename']
              subprocess.run(['curl','-fsSL','--retry','3',entry['url'],'-o',str(path)],check=True)
              assert hashlib.sha256(path.read_bytes()).hexdigest()==entry['sha256'],entry['filename']
          PY
      - name: Host JVM stress (production MIDI parser -> Brain -> Sequencer -> Engine, fake ports/JNI)
        run: python3 tools/test_rtdiag.py --out evidence/rtdiag-jvm 2>&1 | tee evidence/rtdiag-jvm.log
      - name: Native production note/render code with MOCK BASS (overhead + mutex contention model)
        run: python3 tools/test_rtdiag_native.py --out evidence/rtdiag-native 2>&1 | tee evidence/rtdiag-native.log
      - name: Real Linux BASSMIDI decode-cost curve (synthetic SF2, x86)
        run: |
          set -euo pipefail
          mkdir -p /tmp/bass-linux /tmp/bassmidi-linux
          curl -fL --retry 3 https://www.un4seen.com/files/bass24-linux.zip -o /tmp/bass-linux.zip
          curl -fL --retry 3 https://www.un4seen.com/files/bassmidi24-linux.zip -o /tmp/bassmidi-linux.zip
          unzip -q /tmp/bass-linux.zip -d /tmp/bass-linux
          unzip -q /tmp/bassmidi-linux.zip -d /tmp/bassmidi-linux
          python3 tools/test_rtdiag_real_bass.py /tmp/bass-linux /tmp/bassmidi-linux --out evidence/rtdiag-real 2>&1 | tee evidence/rtdiag-real.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RTDIAG-evidence-${{ github.run_id }}
          path: |
            evidence/**/*.log
            evidence/**/*.txt
          if-no-files-found: error
