name: EXPERIMENTAL-UNVERIFIED debug APK
on:
  push:
    branches: [experiment/smooth-style-transition]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  debug:
    if: github.ref == 'refs/heads/experiment/smooth-style-transition'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      SOURCE_SHA: e75cee02887dfee3f0b3f8c924ffa40fcfc899a1
      BASELINE_SHA: c13fa3e1aec416b8378010e13b1c86914c246e4a
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          link-to-sdk: true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Prepare exact-source verifier and experimental provenance
        run: |
          set -euo pipefail
          mkdir evidence
          cat > evidence/verify.py <<'PYVERIFY'
          import hashlib,json,os,subprocess,sys,stat
          from pathlib import Path
          sys.dont_write_bytecode=True
          root=Path('candidate').resolve()
          def git(*args):
              return subprocess.check_output(['git',*args],cwd=root)
          source=os.environ['SOURCE_SHA'];base=os.environ['BASELINE_SHA']
          allowed={
            'app/src/main/java/com/yourapp/arranger/ArrangerBrain.kt':'2cc9ea2b48e007089615f9bf0d71b81d4ebc9ebf6ecdcb2390bd3c06aff032ec',
            'app/src/main/java/com/yourapp/yamahaarranger/arranger/StyleSequencer.kt':'6231ba78b041a0d9549a22c551731cb5f2f622d3db75bbd575c112fcd94847da'}
          assert git('rev-parse','HEAD').decode().strip()==source,'Wrong source SHA'
          assert git('rev-parse','HEAD^').decode().strip()==base,'Wrong source parent'
          def tree(sha):
              out={}
              for item in git('ls-tree','-rz',sha).split(b'\x00'):
                  if item:
                      attrs,path=item.split(b'	',1);mode,kind,oid=attrs.decode().split()
                      assert kind=='blob' and mode in ('100644','100755'),'Unsupported tree entry'
                      out[path.decode()]=(mode,oid)
              return out
          before=tree(base);after=tree(source)
          assert len(before)==417 and before.keys()==after.keys(),'Path set drift'
          changed={p for p in before if before[p]!=after[p]}
          assert changed==set(allowed),'Unauthorized committed delta'
          assert not git('status','--porcelain','--untracked-files=no'),'Tracked worktree/index drift'
          for path,(mode,oid) in after.items():
              f=root/path
              assert f.is_file() and not f.is_symlink(),'Missing/symlink tracked file'
              assert not any(q.is_symlink() for q in f.parents if q!=root and root in q.parents),'Symlink ancestor'
              assert bool(f.stat().st_mode&stat.S_IXUSR)==(mode=='100755'),'Mode drift'
              data=f.read_bytes()
              assert data==git('cat-file','blob',oid),'Worktree bytes differ from commit'
              if path in allowed:
                  assert hashlib.sha256(data).hexdigest()==allowed[path],'Wrong frozen source'
                  assert mode==before[path][0],'Production mode drift'
              else:
                  assert after[path]==before[path],'Protected blob drift'
          phase=sys.argv[1]
          sys.path.insert(0,str(root/'tools'))
          from generated_bass_sdk_guard import PATHS,verify_generated_sdk
          sdk=set(PATHS)
          extras=set(git('ls-files','--others','--exclude-standard').decode().splitlines())
          extras|=set(git('ls-files','--others','--ignored','--exclude-standard').decode().splitlines())
          if phase=='after':
              generated=('.gradle/','build/','app/build/','app/.cxx/')
              extras={p for p in extras if not p.startswith(generated)}
          assert extras==sdk,'Unknown build input: '+str(extras-sdk)
          for path in sdk:
              f=root/path
              assert not f.is_symlink() and not any(q.is_symlink() for q in f.parents if q!=root and root in q.parents),'SDK symlink'
          verify_generated_sdk(root,sdk)
          report={'label':'EXPERIMENTAL-UNVERIFIED','source_sha':source,'baseline_sha':base,
            'workflow_sha':os.environ['GITHUB_SHA'],'workflow_run':os.environ['GITHUB_RUN_ID'],
            'frozen_source_sha256':allowed,'protected_tracked_paths':415,'sdk_files':6,
            'phase':phase,'ready_certified':False,'audio_certified':False,
            'known_risks':['Main/Fill admission failures','Intro/Ending from STOP','Fill-to-Fill UNKNOWN','S01 STOP lifecycle','Android PCM unverified']}
          Path('evidence/input-'+phase+'.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report))
          PYVERIFY
          git -C candidate diff "$BASELINE_SHA" "$SOURCE_SHA" > evidence/frozen-source.diff
      - name: Install CMake and exact historical Android SDK inputs
        working-directory: candidate
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'cmake;3.22.1'
          mkdir /tmp/bass /tmp/bassmidi
          curl -fL https://www.un4seen.com/files/bass24-android.zip -o /tmp/bass.zip
          curl -fL https://www.un4seen.com/files/bassmidi24-android.zip -o /tmp/bassmidi.zip
          unzip -q /tmp/bass.zip -d /tmp/bass
          unzip -q /tmp/bassmidi.zip -d /tmp/bassmidi
          mkdir -p app/src/main/cpp/basssdk
          cp "$(find /tmp/bass -type f -iname bass.h -print -quit)" app/src/main/cpp/basssdk/bass.h
          cp "$(find /tmp/bassmidi -type f -iname bassmidi.h -print -quit)" app/src/main/cpp/basssdk/bassmidi.h
          for abi in arm64-v8a armeabi-v7a; do
            mkdir -p "app/src/main/jniLibs/$abi"
            cp "$(find /tmp/bass -type f -path "*/$abi/libbass.so" -print -quit)" "app/src/main/jniLibs/$abi/libbass.so"
            cp "$(find /tmp/bassmidi -type f -path "*/$abi/libbassmidi.so" -print -quit)" "app/src/main/jniLibs/$abi/libbassmidi.so"
          done
      - name: Verify clean candidate SHA, two source blobs, 415 protected paths and SDK6
        run: python3 evidence/verify.py before
      - name: Assemble original debug configuration (both ABIs; no READY certification)
        working-directory: candidate
        run: |
          set -euo pipefail
          gradle --no-daemon --max-workers=2 assembleDebug --stacktrace 2>&1 | tee ../evidence/gradle-debug.log
      - name: Verify source integrity after build
        if: always()
        run: python3 evidence/verify.py after
      - name: Check APK ABIs, Stage 3 exclusion and debug signature
        run: |
          set -euo pipefail
          python3 - <<'PYAPK'
          import hashlib,json,zipfile
          from pathlib import Path
          p=Path('candidate/app/build/outputs/apk/debug/app-debug.apk')
          with zipfile.ZipFile(p) as z:
              for abi in ['arm64-v8a','armeabi-v7a']:
                  data=z.read('lib/'+abi+'/libyamaha_arranger_native.so')
                  for symbol in [b'nativePrepareExperimentalDrum',b'nativeExperimentalDrumOn',b'nativeExperimentalDrumOff',b'nativeEnableExperimentalDrum',b'nativeClearExperimentalDrum']:
                      assert symbol not in data,(abi,symbol)
                  for library in ['libbass.so','libbassmidi.so']:
                      assert 'lib/'+abi+'/'+library in z.namelist()
          Path('evidence/apk.json').write_text(json.dumps({'label':'EXPERIMENTAL-UNVERIFIED','sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'bytes':p.stat().st_size,'abis':['arm64-v8a','armeabi-v7a']},indent=2)+'\n')
          PYAPK
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose candidate/app/build/outputs/apk/debug/app-debug.apk | tee evidence/apk-signature.txt
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging candidate/app/build/outputs/apk/debug/app-debug.apk > evidence/apk-badging.txt
          grep -q application-debuggable evidence/apk-badging.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EXPERIMENTAL-UNVERIFIED-evidence
          path: evidence/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: EXPERIMENTAL-UNVERIFIED-arm64-v8a-armeabi-v7a
          path: candidate/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
